<div class="rainviewer">

  <!-- Loading -->
  <div class="rainviewer__state" *ngIf="loading">
    <span class="spinner"></span>
    <span>Niederschlagsprognose laden…</span>
  </div>

  <!-- Error -->
  <div class="rainviewer__state rainviewer__state--error" *ngIf="error">
    <span>⚠️ Fehler beim Laden</span>
    <span class="error-detail">{{ errorMsg }}</span>
  </div>

  <!-- Karte: komplett statisch, keine Kartenbibliothek. Genau 4 Kacheln,
       einmalig positioniert, nie wieder neu berechnet. -->
  <div class="rainviewer__map-wrap" [class.rainviewer__map-wrap--hidden]="loading || error">

    <div
      class="rainviewer__mosaic"
      [style.margin-left.px]="-mosaicOffsetX"
      [style.margin-top.px]="-mosaicOffsetY"
    >
      <img
        *ngFor="let tile of tiles"
        class="rainviewer__tile"
        [src]="tile.url"
        [style.left.px]="tile.left"
        [style.top.px]="tile.top"
        alt=""
        loading="eager"
      />

      <div
        *ngFor="let cell of cellPositions; let i = index"
        class="rainviewer__cell"
        [style.left.px]="cell.left"
        [style.top.px]="cell.top"
        [style.width.px]="cell.width"
        [style.height.px]="cell.height"
        [style.background-color]="activeColors[i]"
        [style.opacity]="activeOpacities[i]"
        [title]="activeTitles[i]"
      ></div>
    </div>

    <div class="rainviewer__attribution">
      © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende
      · Niederschlag: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
    </div>

    <div class="rainviewer__slider" *ngIf="!loading && !error && frames.length">
      <span class="rainviewer__time">
        {{ formatTime(frames[activeIndex].time) }}
        <span class="badge" *ngIf="isNow(activeIndex)">Jetzt</span>
        <span class="badge badge--muted" *ngIf="!isNow(activeIndex)">+{{ hoursAhead(activeIndex) }}h</span>
      </span>
      <input
        type="range"
        class="rainviewer__range"
        min="0"
        [max]="frames.length - 1"
        step="1"
        [value]="activeIndex"
        (input)="onSlide($event)"
        aria-label="Zeitpunkt der Niederschlagsprognose"
      />
    </div>
  </div>

</div>
