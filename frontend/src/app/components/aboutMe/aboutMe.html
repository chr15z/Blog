<div class="smooth">
  <section class="snap-section">
    <div class="content">


      <h1>Contact Information</h1>
      <div class="contact-info">
        <p><i class="fa-solid fa-envelope"></i> chrisztlr&#64;gmail.com</p>
        <p><i class="fa-solid fa-location-dot"></i> vienna, austria</p>
      </div>

      <div class="connect-card work-item">

        <div class="badges">

          <div class="trapdoor-linkedin">
            <div class="top-linkedin door-linkedin"></div>
            <div class="bottom-linkedin door-linkedin"></div>
            <a href="https://www.linkedin.com/in/christoph-zeitler-338a64247/" target="_blank" rel="noopener noreferrer" class="linkedin-button">Connect</a>
          </div>

          <div class="trapdoor-github">
            <div class="top-github door-github"></div>
            <div class="bottom-github door-github"></div>
            <a href="https://github.com/chr15z/" target="_blank" rel="noopener noreferrer" class="github-button">Follow</a>
          </div>

        </div>

        <div class="github-chart">
          <img [src]="githubChartUrl" alt="GitHub contribution graph" class="github-chart-img" loading="lazy">
          <span class="github-chart-caption">recent GitHub activity</span>
        </div>

      </div>

    </div>


  </section>

  <section class="snap-section">
    <div class="content tech-stack-content">
      <h1>Tech Stack</h1>
      <p>
        A selection of technologies I’ve used across my projects.
      </p>

      <div class="tech-filters">
        <button
          type="button"
          class="filter-chip"
          [class.active]="activeFilter === 'all'"
          (click)="setFilter('all')">
          All
        </button>
        <button
          *ngFor="let category of categories"
          type="button"
          class="filter-chip"
          [class.active]="activeFilter === category"
          (click)="setFilter(category)">
          {{ category }}
        </button>
      </div>

      <div class="tech-groups">
        <div class="tech-group" *ngFor="let group of visibleGroups">
          <div class="tech-group-title">{{ group.type }}</div>
          <div class="tech-group-items">
            <div class="work-item tech-item" *ngFor="let tech of group.items; trackBy: trackByKey">
              <img [src]="tech.image" [alt]="tech.title + ' Logo'" class="img-tech">
              <span class="tech-title">{{ tech.title }}</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>
</div>
